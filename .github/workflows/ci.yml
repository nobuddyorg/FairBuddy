name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run static analysis
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh -o /tmp/install.sh
          bash /tmp/install.sh
          $HOME/.opengrep/cli/latest/opengrep --config auto --error

  prek-check:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache-prek

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv python install
          uv sync --dev

      - name: Install Node dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Prek (pre-commit)
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,opengrep-check

  services-checks:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache-services

    environment: ci

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install
          uv sync --dev

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: dummy-region
          AWS_ACCESS_KEY_ID: dummy-access-key-id
          AWS_SECRET_ACCESS_KEY: dummy-secret-access-key
          PULUMI_CONFIG_PASSPHRASE: dummy-passphrase
        run: uv run pytest -m "not integration" --junitxml=reports/test-results.xml --cov=services --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --cov-fail-under=80

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3
        if: ${{ always() && !env.ACT }}
        with:
          check_name: "Unit Tests"
          files: |
            reports/test-results.xml

      - name: Coverage Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: reports/coverage.xml
          badge: true
          format: markdown
          output: both
          fail_below_min: true
          thresholds: "80"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: reports/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nobuddyorg/FairBuddy
        if: ${{ !env.ACT }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        with:
          recreate: true
          path: code-coverage-results.md

  mutation-testing:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache-mutation

    needs:
      - prek-check
      - services-checks
      - static-analysis

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install
          uv sync --dev

      - name: Run mutation testing
        id: mutation
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: dummy-region
          AWS_ACCESS_KEY_ID: dummy-access-key-id
          AWS_SECRET_ACCESS_KEY: dummy-secret-access-key
          PULUMI_CONFIG_PASSPHRASE: dummy-passphrase
        run: ./scripts/test/mutation.sh 80

      - name: Add Mutation Testing PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        with:
          header: mutation-testing
          recreate: true
          path: reports/mutation-summary.md

      - name: Fail if mutation score is below threshold
        if: steps.mutation.outcome == 'failure'
        run: exit 1

  frontend-tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read

    needs:
      - prek-check
      - services-checks
      - static-analysis

    defaults:
      run:
        working-directory: frontend

    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          npm run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Publish Playwright Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3
        if: ${{ always() && !env.ACT }}
        with:
          check_name: "Playwright UI Tests"
          files: ./frontend/results/junit.xml

  integration-tests:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache-integration

    environment: ci
    needs:
      - frontend-tests
      - mutation-testing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install
          uv sync --dev

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d
        if: ${{ !env.ACT }}

      - name: Run integration tests
        working-directory: infrastructure
        if: ${{ !env.ACT }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi login s3://fairbuddy-pulumi-state
          uv run pytest -m integration tests/
